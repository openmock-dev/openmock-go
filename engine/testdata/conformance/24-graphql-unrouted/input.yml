openmock: 0.2.0
info:
  title: GraphQL unrouted request (operationType participates in routing)
# The document answers GetOrder only as a query. The request below carries the
# same operationName but operationType mutation, so no operation matches —
# routing compares both.
servers:
  - name: main
    type: graphql
    operations:
      - operationType: query
        operationName: GetOrder
        scenarios:
          - name: found
            response:
              data:
                order:
                  id: "1"
