openmock: 0.2.0
info:
  title: GraphQL query with variables templating
# operationType is omitted: query is the default.
servers:
  - name: main
    type: graphql
    operations:
      - operationName: GetOrder
        scenarios:
          - name: found
            response:
              data:
                order:
                  id: "{{request.variables.orderId}}"
                  state: SHIPPED
