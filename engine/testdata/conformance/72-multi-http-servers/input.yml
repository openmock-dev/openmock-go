openmock: 0.2.0
info:
  title: Two HTTP servers with the same route
# A document may declare several servers of the same type (spec §3.3) — here
# two HTTP services that both expose GET /health. Requests name their server
# (spec §4, §8 step 1), so the same concrete path resolves to a different
# response on each: server addressing, not declaration order, decides.
servers:
  - name: users-api
    type: http
    operations:
      - method: GET
        path: /health
        scenarios:
          - name: ok
            response:
              status: 200
              headers:
                Content-Type: application/json
              body:
                service: users
                status: up
  - name: billing-api
    type: http
    operations:
      - method: GET
        path: /health
        scenarios:
          - name: ok
            response:
              status: 200
              headers:
                Content-Type: application/json
              body:
                service: billing
                status: up
