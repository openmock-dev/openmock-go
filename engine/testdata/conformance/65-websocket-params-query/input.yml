openmock: 0.2.0
info:
  title: WebSocket params and query when-facets (connection-scoped)
# params (captured from the connection path template) and query (from the
# connection URL) are connection-scoped facets (spec §4.4, §6.1). Query
# facet values are lists (spec §4.6).
servers:
  - name: main
    type: websocket
    operations:
      - path: /ws/rooms/{room}
        scenarios:
          - name: en-room-42
            when:
              params:
                room: "42"
              query:
                lang: ["en"]
            response:
              messages:
                - view: en-room-42
          - name: default
            response:
              messages:
                - view: default
