openmock: 0.2.0
info:
  title: "INVALID: malformed pattern"
# "(" is not a valid pattern in any regex dialect. A pattern that is not
# valid RE2 makes the document invalid (spec §6.1) and MUST be refused at
# load time (spec §3.6) — never deferred to the first matching request.
servers:
  - name: main
    type: http
    operations:
      - method: GET
        path: /orders
        scenarios:
          - name: broken
            when:
              headers:
                X-Id:
                  pattern: "("
            response:
              status: 200
              body:
                view: broken
          - name: default
            response:
              status: 200
              body:
                view: default
