name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser's changelog needs the full commit history, not the
          # default shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      # Safety gate: re-run the full test suite against the tagged commit
      # before building and publishing release artifacts from it.
      - run: go test -race ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
